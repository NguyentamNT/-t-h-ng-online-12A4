<script>
function guiDonHang() {
  const ten = document.getElementById("ten").value.trim();
  const sdt = document.getElementById("sdt").value.trim();

  if (!ten || !sdt) {
    alert("Vui lòng nhập tên và số điện thoại!");
    return;
  }

  let donhang = "";
  let tong = 0;

  products.forEach((sp, i) => {
    const sl = Number(document.getElementById("sl" + i).value);
    if (sl > 0) {
      const tien = sl * sp.gia;
      tong += tien;
      donhang += `${sp.ten}: ${sl} x ${sp.gia} = ${tien} đ\n`;
    }
  });

  if (donhang === "") {
    alert("Bạn chưa chọn mặt hàng!");
    return;
  }

  const now = new Date().toLocaleString("vi-VN");

  const data = new FormData();
  data.append("entry.1936250066", ten);
  data.append("entry.1289747676", sdt);
  data.append("entry.1071319538", now);
  data.append("entry.929742002", donhang + `\nTỔNG: ${tong} đ`);

  fetch(
    "https://docs.google.com/forms/u/0/d/e/1FAIpQLSd09GzRdUOSjEhAp6138o_bxbXzccj5iAAIqbjMXt2FSyD6NQ/formResponse",
    {
      method: "POST",
      mode: "no-cors",
      body: data
    }
  );

  alert("✅ Đã gửi đơn hàng thành công!");
}
</script>
