<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đặt hàng online</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: auto; }
    h1 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #f0f0f0; }
    input[type="number"] { width: 70px; }
    input[type="text"] { width: 100%; padding: 6px; }
    .btn { margin-top: 20px; padding: 12px 25px; font-size: 16px; cursor: pointer; }
    .tong { text-align: right; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

<h1>ĐƠN ĐẶT HÀNG ONLINE LỚP 12A4</h1>

<h3>Thông tin khách hàng</h3>
<p>
  Tên khách hàng:<br>
  <input id="ten" type="text">
</p>
<p>
  Số điện thoại:<br>
  <input id="sdt" type="text">
</p>

<h3>Danh sách mặt hàng</h3>
<table>
  <thead>
    <tr>
      <th>Mặt hàng</th>
      <th>Giá</th>
      <th>Số lượng</th>
    </tr>
  </thead>
  <tbody id="danhsach"></tbody>
</table>

<div class="tong" id="tongtien">Tổng tiền: 0 đ</div>
<button class="btn" onclick="guiDonHang()">📦 GỬI ĐƠN HÀNG</button>

<script>
let products = [];

fetch("products.json")
  .then(res => res.json())
  .then(data => {
    products = data;
    const tbody = document.getElementById("danhsach");
    data.forEach((sp, i) => {
      tbody.innerHTML += `
        <tr>
          <td>${sp.ten}</td>
          <td>${sp.gia.toLocaleString()} đ</td>
          <td><input type="number" min="0" value="0" id="sl${i}" onchange="tinhTong()"></td>
        </tr>`;
    });
  });

function tinhTong() {
  let tong = 0;
  products.forEach((sp, i) => {
    const sl = Number(document.getElementById("sl" + i).value);
    tong += sl * sp.gia;
  });
  document.getElementById("tongtien").innerText = "Tổng tiền: " + tong.toLocaleString() + " đ";
}

function guiDonHang() {
  const ten = document.getElementById("ten").value.trim();
  const sdt = document.getElementById("sdt").value.trim();
  if (!ten || !sdt) {
    alert("Vui lòng nhập tên và SĐT"); return;
  }

  let tong = 0;
  const data = new FormData();
  const now = new Date().toLocaleString('vi-VN');

  products.forEach((sp, i) => {
    const sl = Number(document.getElementById("sl" + i).value);
    tong += sl * sp.gia;
    // mỗi mặt hàng = 1 cột trong Google Sheets
    data.append(`entry_${i}`, sl); // sẽ map với Google Form
  });

  data.append("entry.1936250066", ten); // Tên
  data.append("entry.1289747676", sdt); // SĐT
  data.append("entry.1071319538", tong); // Tổng tiền
  data.append("entry.929742002", now); // Thời gian đặt

  fetch("https://docs.google.com/forms/u/0/d/e/1FAIpQLSd09GzRdUOSjEhAp6138o_bxbXzccj5iAAIqbjMXt2FSyD6NQ/formResponse", {
    method: "POST",
    mode: "no-cors",
    body: data
  });

  // Xuất PDF đơn hàng
  let noiDung = `ĐƠN HÀNG\nTên: ${ten}\nSĐT: ${sdt}\nThời gian: ${now}\n`;
  products.forEach((sp, i) => {
    const sl = Number(document.getElementById("sl" + i).value);
    if (sl > 0) noiDung += `${sp.ten}: ${sl}\n`;
  });
  noiDung += `Tổng tiền: ${tong} đ`;

  const blob = new Blob([noiDung], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'don-hang.pdf';
  a.click();

  alert("✅ Đã gửi đơn và xuất PDF!");
}
</script>
</body>
</html>
